<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Kapes Adventures — Hi-Fi Combo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  /* Real Kapes fonts from the live site */
  @font-face {
    font-family: 'AcademySansExpanded-Black';
    src: url('https://cdn.shopify.com/s/files/1/0777/3326/5724/files/AcademySans-Regular_978467eb-a51c-4846-87f5-dc00c17c1e10.woff?v=9446173801') format('woff');
    font-weight: 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'AcademySansExpanded-Bold';
    src: url('https://cdn.shopify.com/s/files/1/0777/3326/5724/files/AcademySansExpanded-Bold_ed3d0942-5858-4fad-8886-e581bbbada6a.woff?v=9446173800') format('woff');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'League Gothic';
    src: url('https://cdn.jsdelivr.net/gh/theleagueof/league-gothic/webfonts/LeagueGothic-Regular.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
  }

  :root{
    --orange: #FF7700;
    --orange-600: #E56600;
    --charcoal: #1A1A1A;
    --ink-2: #2B2B2B;
    --muted: #6B6B6B;
    --cream: #FAFAF7;
    --sand: #F1EEE7;
    --sand-2: #E5E0D5;
    --rule: #1A1A1A;
    --line: rgba(26,26,26,.12);
    --display: 'AcademySansExpanded-Bold','AcademySansExpanded-Black','Helvetica Neue',sans-serif;
    --gothic: 'League Gothic', 'AcademySansExpanded-Bold', sans-serif;
    --body: 'Montserrat', 'Proxima Nova', 'Helvetica Neue', sans-serif;
    --serif: 'Libre Baskerville', Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#222;color:var(--charcoal);font-family:var(--body);}
  body{ -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }

  /* ─── Top chrome (prototype only — hidden in production) ────── */
  body:not(.prototype) .chrome,
  body:not(.prototype) .vp-bar,
  body:not(.prototype) .tweaks-btn,
  body:not(.prototype) .tweaks-panel { display:none !important; }
  body:not(.prototype) .stage{ padding:0 !important; background:var(--cream) !important; }
  body:not(.prototype) .viewport{
    max-width:none !important; margin:0 !important;
    background:var(--cream) !important; border-radius:0 !important;
    overflow:visible !important; box-shadow:none !important;
  }
  body:not(.prototype){ background:var(--cream) !important; }

  .chrome{
    position:sticky; top:0; z-index:60;
    background:#0F0F0F; color:#fff;
    border-bottom:1px solid #262626;
    padding:12px 20px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    font-family:var(--body); font-size:12px;
  }
  .brand{
    font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:.02em;
    text-transform:uppercase;
  }
  .brand b{ color:var(--orange); }
  .chrome .meta{ color:#9a9a9a; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .tab-groups{ display:flex; gap:10px; margin-left:auto; flex-wrap:wrap; align-items:center; }
  .tab-group{ display:flex; gap:2px; background:#1a1a1a; padding:4px 4px 4px 14px; border-radius:999px; align-items:center; }
  .tg-label{ font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:#777; font-weight:700; margin-right:4px; }
  .tab{
    font-family:var(--body); font-size:11.5px; font-weight:600;
    padding:7px 13px; border:none; background:transparent; color:#cfcfcf; cursor:pointer;
    border-radius:999px; letter-spacing:.02em; white-space:nowrap;
  }
  .tab.active{ background:var(--orange); color:#fff; }
  .tab:hover:not(.active){ color:#fff; }

  /* ─── Viewport ──────────────────────────────────────────────── */
  .stage{ padding:24px 24px 64px; background:#1A1A1A; min-height:100vh;}
  .viewport{
    max-width:1360px; margin:0 auto;
    background:var(--cream);
    border-radius:8px;
    overflow:hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
  }
  .vp-bar{
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex; gap:10px; align-items:center;
    font-size:11px; color:var(--muted);
    background:var(--cream);
  }
  .vp-bar .dots{ display:flex; gap:6px; }
  .vp-bar .dot{ width:10px; height:10px; border-radius:50%; background:#e6e3d8; }
  .vp-bar .dot:nth-child(2){ background:#f0d9a0; }
  .vp-bar .dot:nth-child(3){ background:#cadfc3; }
  .vp-bar .url{
    flex:1; background:#F3EFE3; padding:5px 12px; border-radius:6px;
    color:var(--charcoal); font-family:'SF Mono', ui-monospace, monospace; font-size:11px;
  }

  /* ─── Common page chrome inside viewport ─────────────────────── */
  .site-nav{
    display:flex; align-items:center; gap:32px;
    padding:22px 48px;
    border-bottom:1px solid var(--line);
    background:var(--cream);
    position:relative; z-index:5;
  }
  .site-nav .logo{
    font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:.02em;
    text-transform:uppercase; color:var(--charcoal);
  }
  .site-nav .logo b{ color:var(--orange); }
  .site-nav ul{ display:flex; gap:26px; list-style:none; margin:0; padding:0; }
  .site-nav li{ font-size:13px; font-weight:500; color:var(--ink-2); cursor:pointer;}
  .site-nav li:hover{ color:var(--orange); }
  .site-nav .right{ margin-left:auto; display:flex; gap:10px; align-items:center;}
  .btn-pill{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    padding:12px 22px; border-radius:999px; font-weight:700; font-size:13px;
    letter-spacing:.02em; cursor:pointer; border:none;
    transition: transform .15s, background .2s;
  }
  .btn-pill:hover{ transform:translateY(-1px); }
  .btn-primary{ background:var(--charcoal); color:#fff; }
  .btn-primary:hover{ background:#000; }
  .btn-action{ background:var(--orange); color:#fff; }
  .btn-action:hover{ background:var(--orange-600); }
  .btn-ghost{ background:transparent; color:var(--charcoal); border:1.5px solid var(--charcoal); }
  .btn-ghost:hover{ background:var(--charcoal); color:#fff; }

  /* ─── Global helpers ─────────────────────────────────────────── */
  .container{ max-width:1240px; margin:0 auto; padding:0 48px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-size:11px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted);
  }
  .eyebrow::before{
    content:""; width:24px; height:1px; background:var(--orange);
  }
  h1.display, h2.display, h3.display{
    font-family:var(--display); font-weight:700;
    line-height:.92; letter-spacing:-.01em;
    color:var(--charcoal); margin:0;
    text-wrap:balance;
  }
  h1.display{ font-size: clamp(56px, 6.2vw, 104px); }
  h2.display{ font-size: clamp(40px, 4.2vw, 68px); }
  h3.display{ font-size: clamp(24px, 2vw, 32px); }
  .accent{ color:var(--orange); }
  .lead{ font-size:18px; line-height:1.55; color:#2a2a2a; }
  .tnum{ font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* Image placeholder style when no image provided — subtle stripe */
  .img-placeholder{
    background:
      repeating-linear-gradient(135deg, rgba(26,26,26,.05) 0 1px, transparent 1px 10px),
      var(--sand);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-family:'SF Mono',ui-monospace,monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.1em;
  }

  img.kapes{
    display:block; width:100%; height:100%; object-fit:cover;
  }

  /* Footer (shared) */
  .foot{
    background:var(--charcoal); color:#bbb;
    padding:72px 48px 40px;
  }
  .foot .cols{ display:grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap:40px; max-width:1240px; margin:0 auto;}
  .foot h5{ color:#fff; text-transform:uppercase; font-size:12px; letter-spacing:.1em; margin:0 0 14px;}
  .foot ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; font-size:13px;}
  .foot .brand{ font-size:28px; }
  .foot .fine{ max-width:1240px; margin:32px auto 0; padding-top:24px; border-top:1px solid #262626; display:flex; justify-content:space-between; color:#777; font-size:12px;}

  /* ─── Tweaks panel ───────────────────────────────────────────── */
  .tweaks-btn{
    position:fixed; right:22px; bottom:22px; z-index:90;
    background:var(--orange); color:#fff; border:none;
    padding:11px 18px; border-radius:999px; font-weight:700; font-size:12px;
    letter-spacing:.04em; cursor:pointer; text-transform:uppercase;
    box-shadow: 0 10px 30px rgba(255,119,0,.4);
  }
  .tweaks-panel{
    position:fixed; right:22px; bottom:74px; z-index:90;
    width:280px; background:#fff; color:var(--charcoal);
    border-radius:14px; padding:18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    display:none; font-size:12px;
  }
  .tweaks-panel.open{ display:block; }
  .tweaks-panel h4{ margin:0 0 14px; font-family:var(--display); font-size:16px; text-transform:uppercase; letter-spacing:.04em;}
  .tweaks-panel .grp{ margin-bottom:14px; }
  .tweaks-panel label{
    display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px; font-weight:600;
  }
  .segs{ display:flex; background:var(--sand); padding:3px; border-radius:999px;}
  .segs button{
    flex:1; border:none; background:transparent; padding:7px 8px; border-radius:999px;
    font-size:11px; font-weight:600; cursor:pointer; color:var(--ink-2); font-family:var(--body);
  }
  .segs button.on{ background:#fff; color:var(--charcoal); box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .swatches{ display:flex; gap:8px;}
  .sw{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
  .sw.on{ border-color:var(--charcoal); }

  /* accent swap */
  body.acc-emerald{ --orange:#0B7A5A; --orange-600:#07593F; }
  body.acc-navy{ --orange:#1D3557; --orange-600:#142842; }
  body.acc-rust{ --orange:#C75D32; --orange-600:#A64A27; }

  /* density */
  body.compact .container{ padding:0 32px; }
  body.compact .site-nav{ padding:16px 32px; }
  body.compact .section{ padding-block: 64px !important; }

  /* ─── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 1024px) {
    .container{ padding: 0 28px !important; }
    .stage{ padding: 16px 16px 48px !important; }
    .vp-bar > div:last-child{ display: none; } /* "1240 · desktop" label */
  }

  @media (max-width: 900px) {
    .container{ padding: 0 22px !important; }
    .site-nav{ padding: 14px 22px !important; flex-wrap: wrap !important; row-gap: 14px !important; gap: 18px !important; }
    .site-nav ul{ flex-wrap: wrap !important; row-gap: 8px !important; gap: 18px !important; order: 3; width: 100%; }
    .site-nav .right{ margin-left: auto; }
    .foot{ padding: 56px 22px 32px !important; }
    .foot .cols{ grid-template-columns: 1fr 1fr !important; gap: 32px !important; }
    .foot .fine{ flex-direction: column; gap: 8px; align-items: flex-start; }

    /* Top chrome */
    .chrome{ padding: 10px 18px !important; gap: 10px !important; }
    .chrome .meta{ display: none !important; }
    .chrome .tab-groups{ margin-left: 0 !important; width: 100% !important; }
    .chrome .tab-group{ flex-wrap: wrap !important; row-gap: 4px !important; padding: 4px 4px 4px 10px !important; }
    .tg-label{ display: none !important; }

    /* Stack inline grids */
    [style*="display:grid"][style*="grid-template-columns"]:not([style*="repeat(12"]):not([style*="80px 1fr"]):not([style*="260px repeat"]),
    [style*="display: grid"][style*="grid-template-columns"]:not([style*="repeat(12"]):not([style*="80px 1fr"]):not([style*="260px repeat"]) {
      grid-template-columns: 1fr !important;
      gap: 28px !important;
    }
    /* Keep small stat grids as 2-col */
    [style*="repeat(4,1fr)"], [style*="repeat(4, 1fr)"],
    [style*="repeat(3,1fr)"], [style*="repeat(3, 1fr)"] {
      grid-template-columns: repeat(2, 1fr) !important;
    }

    /* Timeline + activity log get horizontal scroll instead of stacking */
    [style*="260px repeat(12"], [style*="80px 1fr"]{
      overflow-x: auto !important;
      min-width: 0 !important;
    }

    /* Section padding */
    .section, section{ padding-top: 64px !important; padding-bottom: 64px !important; }

    /* Display sizes */
    h1.display{ font-size: clamp(36px, 8vw, 56px) !important; }
    h2.display{ font-size: clamp(28px, 6vw, 42px) !important; }
    h3.display{ font-size: clamp(20px, 4vw, 28px) !important; }
    .lead{ font-size: 16px !important; }
    .display{ text-wrap: balance; }
  }

  @media (max-width: 640px) {
    .container{ padding: 0 16px !important; }

    /* All multi-col grids → single col */
    [style*="repeat(2"], [style*="repeat(3"], [style*="repeat(4"], [style*="repeat(5"], [style*="repeat(6"], [style*="repeat(7"]{
      grid-template-columns: 1fr !important;
    }
    .foot .cols{ grid-template-columns: 1fr !important; }

    /* Tab chrome — let it scroll horizontally */
    .chrome{ flex-wrap: nowrap !important; overflow-x: auto !important; gap: 8px !important; }
    .chrome .tab-groups{ flex-wrap: nowrap !important; }
    .chrome .tab-group{ flex-wrap: nowrap !important; }
    .brand{ font-size: 16px !important; flex-shrink: 0; }

    h1.display{ font-size: clamp(30px, 9vw, 42px) !important; }
    h2.display{ font-size: clamp(24px, 7vw, 32px) !important; }
    .btn-pill{ padding: 11px 18px !important; font-size: 12px !important; }

    /* Hero photo containers — let aspect-ratio shrink */
    [style*="aspect-ratio:4/5"], [style*="aspect-ratio: 4/5"]{
      max-height: 360px !important;
    }

    /* Hide some decorative meta on mobile */
    .vp-bar{ padding: 8px 12px !important; }

    /* Outcomes / data tables — let them scroll */
    [style*="grid-template-columns:160px 1fr 180px"],
    [style*="grid-template-columns: 160px 1fr 180px"]{
      grid-template-columns: 100px 1fr 80px !important;
      font-size: 12px !important;
    }
  }

  /* Blog post body — renders the markdown converted by marked.js */
  .blog-body h1, .blog-body h2, .blog-body h3, .blog-body h4{
    font-family: var(--display); color: var(--charcoal);
    line-height: 1.18; margin: 36px 0 14px;
  }
  .blog-body h1{ font-size: 32px; }
  .blog-body h2{ font-size: 26px; }
  .blog-body h3{ font-size: 22px; }
  .blog-body h4{ font-size: 18px; }
  .blog-body p{ margin: 0 0 18px; }
  .blog-body ul, .blog-body ol{ padding-left: 24px; margin: 0 0 18px; }
  .blog-body li{ margin-bottom: 8px; }
  .blog-body blockquote{
    border-left: 4px solid var(--orange);
    padding-left: 22px;
    margin: 32px 0;
    font-family: var(--display);
    font-size: 22px; line-height: 1.3;
    color: var(--charcoal);
  }
  .blog-body a{ color: var(--orange); text-decoration: underline; text-underline-offset: 3px; }
  .blog-body strong{ color: var(--charcoal); font-weight: 700; }
  .blog-body code{ background: var(--sand); padding: 2px 6px; border-radius: 3px; font-size: .9em; }
  .blog-body img{ max-width: 100%; height: auto; border-radius: 4px; margin: 24px 0; }
  .blog-body hr{ border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  /* === Universal mobile safety net — catches inline-style edge cases ===
     Belt-and-braces rules so JSX inline styles can't cause horizontal overflow */
  @media (max-width: 900px){
    .viewport, .viewport *{ max-width: 100%; }
    .viewport img, .viewport video, .viewport iframe{ max-width: 100% !important; height: auto; }
    [style*="left:-"], [style*="left: -"]{ left: 0 !important; }
    [style*="right:-"], [style*="right: -"]{ right: 0 !important; }
    [style*="bottom:-"], [style*="bottom: -"]{ bottom: 12px !important; }
    [style*='gridTemplateColumns:"1.2fr 1fr"'],
    [style*='gridTemplateColumns:"1.3fr 1fr"'],
    [style*='gridTemplateColumns:"1.5fr 1fr"'],
    [style*='gridTemplateColumns:"2fr 1fr"'],
    [style*='gridTemplateColumns:"1fr 1.2fr"'],
    [style*='gridTemplateColumns:"1fr 2fr"']{
      grid-template-columns: 1fr !important;
    }
    [style*="position:fixed"][style*="width:"]{ max-width: 100vw; }
  }

  @media (max-width: 640px){
    .viewport [style*="maxWidth:"]{ max-width: 100% !important; }
    [style*="position:fixed"][style*="inset:0"] > div{ max-width: 95vw !important; }
    [style*="grid-template-columns:90px"], [style*="grid-template-columns: 90px"],
    [style*="grid-template-columns:64px"], [style*="grid-template-columns: 64px"]{
      gap: 16px !important;
    }
    [style*="repeat(7"], [style*="repeat(7,"]{
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }

  /* Mobile horizontal breathing room — applies to any section/div that doesn't
     already declare its own horizontal padding inline. Mobile components use
     `padding:"56px 22px"` etc. on their wrappers; this is the fallback for any
     bare <section> so content never sits edge-to-edge. */
  @media (max-width: 767px){
    .viewport section:not([style*="padding"]){ padding-left: 22px; padding-right: 22px; }
    .container{ padding-left: 22px !important; padding-right: 22px !important; }
  }

  @media (max-width: 640px){
    .tweaks-btn{ right: 12px !important; bottom: 12px !important; padding: 9px 14px !important; font-size: 11px !important; }
    .tweaks-panel{ right: 8px !important; left: 8px !important; bottom: 60px !important; width: auto !important; }
  }

  /* === Mobile shell hooks (Pass 1 mobile design) === */
  @media (max-width: 767px){
    /* No body padding-bottom — the MobileFooter already reserves ~110px at
       its bottom, which sits behind the sticky CTA. Adding body padding here
       only creates a visible cream gap between the footer and the bar.
       Body background is set to charcoal so any safe-area or scroll-bounce
       region below the footer still reads as the dark footer. */
    body{ background: var(--charcoal) !important; padding-bottom: 0; }
    /* Hide the desktop site-nav and legacy footer on mobile (mobile components replace them) */
    .site-nav{ display: none !important; }
    .foot{ display: none !important; }
    /* Hide the prototype tweaks button when bottom CTA shows (would overlap) */
    body.prototype .tweaks-btn{ bottom: 80px !important; }
  }
</style>
</head>

<script>
  // Show prototype chrome only when ?prototype=1 is present in URL.
  if (new URLSearchParams(location.search).has("prototype")) {
    document.body.classList.add("prototype");
  }
</script>

      <button class="tab" data-tab="impact">Impact</button>
      <button class="tab" data-tab="stories">Stories</button>
      <button class="tab" data-tab="about">About</button>
      <button class="tab" data-tab="contact">Contact</button>
    </div>
    <div class="tab-group">
      <span class="tg-label">Schools</span>
      <button class="tab" data-tab="schools">For Schools</button>
      <button class="tab" data-tab="program">Programme</button>
      <button class="tab" data-tab="lp">Scorecard</button>

</div>

<div class="stage">

    <div class="vp-bar">
      <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>

    </div>
    <div id="root"></div>
  </div>
</div>


<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.2/marked.min.js"></script>
<script src="blog-data.js?v=110"></script>

<script type="text/babel" data-presets="env,react" src="hf-shared.jsx?v=110"></script>
