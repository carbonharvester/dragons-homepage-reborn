# Kapes Adventures · Netlify config
# Static site (Babel-standalone in-browser) + Netlify Functions
# History note: previous Vite/React app archived under /_archive_v1 — see git history.

[build]
  # Static site — no build step required. Files are served from the repo root as-is.
  command = "echo 'Static site — no build needed.'"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # SENDGRID_FROM_NAME is the founder's name ("Matthew Benjamin") — not a secret.
  # It legitimately appears throughout the static site (Board Pack, policy docs, About page).
  SECRETS_SCAN_OMIT_KEYS = "SENDGRID_FROM_NAME"

[functions]
  node_bundler = "esbuild"

# Send the bare-domain root to the Hi-Fi shell
# (Browsers will see clean URLs; Netlify rewrites preserve the URL bar.)

# Standalone print-ready documents (live at clean URLs)
[[redirects]]
  from = "/scorecard-report"
  to   = "/Scorecard%20Report.html"
  status = 200

# Customised Board Pack — clean URL form: /board-pack/<school-slug>
# (rewrites to ?s=<slug> so the customisation script picks it up)
[[redirects]]
  from = "/board-pack/:slug"
  to   = "/Board%20Pack.html?s=:slug"
  status = 200

[[redirects]]
  from = "/board-pack"
  to   = "/Board%20Pack.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to   = "/Privacy.html"
  status = 200

[[redirects]]
  from = "/child-protection"
  to   = "/Child%20Protection.html"
  status = 200

[[redirects]]
  from = "/supplier-code"
  to   = "/Supplier%20Code.html"
  status = 200

# SPA catchall — any other path (e.g. /about, /our-approach, /programs/seeds2education)
# serves index.html so the React app can render the right page.
# Static files (.html, .js, .jsx, /photos/*, etc.) are served directly and are NOT rewritten.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# HTML — never cache aggressively; users should always get the latest deploy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static assets aggressively
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JSX files are loaded by Babel-standalone in the browser — bust on each deploy via the ?v=NN query string in the HTML
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
